AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM Template for Serverless Patterns v1 - Data store

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 128
    Timeout: 30
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        USER_POOL_ID: !Ref UserPool
        STACK_NAME: !Ref AWS::StackName

Resources:
  # Cognito
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-UserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-UserPoolClient
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # DynamoDB
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-Users
      AttributeDefinitions:
        - AttributeName: userid
          AttributeType: S
      KeySchema:
        - AttributeName: userid
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # API Gateway + Cognito Authorizer
  UsersApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              Header: Authorization
        AddDefaultAuthorizerToCorsPreflight: false
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # Lambda
  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: users.lambda_handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: '*'
      Events:
        GetUsers:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users
            Method: GET
        GetUserById:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users/{userid}
            Method: GET
        PostUser:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users
            Method: POST
            Auth:
              Authorizer: NONE
        PutUser:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users/{userid}
            Method: PUT
        DeleteUser:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /users/{userid}
            Method: DELETE

  # CloudWatch Alarm — Lambda errors > 0 in 5 minutes
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-LambdaErrors
      AlarmDescription: Triggers when the Lambda function throws any errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UsersFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # CloudWatch Alarm — Lambda p99 duration > 10s
  LambdaLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-HighLatency
      AlarmDescription: Triggers when Lambda p99 duration exceeds 10 seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref UsersFunction
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # CloudWatch Alarm — custom metric: CognitoSignUpError
  CognitoSignUpErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-CognitoSignUpErrors
      AlarmDescription: Triggers on Cognito sign-up failures
      Namespace: !Sub ${AWS::StackName}/UsersAPI
      MetricName: CognitoSignUpError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # CloudWatch Alarm — custom metric: DynamoDBWriteError
  DynamoDBWriteErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-DynamoDBWriteErrors
      AlarmDescription: Triggers on DynamoDB write failures during user registration
      Namespace: !Sub ${AWS::StackName}/UsersAPI
      MetricName: DynamoDBWriteError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # CloudWatch Dashboard
  UsersDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-Dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations & Errors",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda","Invocations","FunctionName","${UsersFunction}"],
                  ["AWS/Lambda","Errors","FunctionName","${UsersFunction}",{"color":"#d62728"}]
                ],
                "period": 300, "stat": "Sum", "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration (p50 / p99)",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda","Duration","FunctionName","${UsersFunction}",{"stat":"p50"}],
                  ["AWS/Lambda","Duration","FunctionName","${UsersFunction}",{"stat":"p99","color":"#ff7f0e"}]
                ],
                "period": 300, "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "width": 12, "height": 6,
              "properties": {
                "title": "API Operations (custom metrics)",
                "region": "${AWS::Region}",
                "metrics": [
                  ["${AWS::StackName}/UsersAPI","GetUsers"],
                  ["${AWS::StackName}/UsersAPI","GetUserById"],
                  ["${AWS::StackName}/UsersAPI","UserRegistered"],
                  ["${AWS::StackName}/UsersAPI","UpdateUser"],
                  ["${AWS::StackName}/UsersAPI","DeleteUser"]
                ],
                "period": 300, "stat": "Sum", "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "width": 12, "height": 6,
              "properties": {
                "title": "Errors & Auth Failures (custom metrics)",
                "region": "${AWS::Region}",
                "metrics": [
                  ["${AWS::StackName}/UsersAPI","CognitoSignUpError",{"color":"#d62728"}],
                  ["${AWS::StackName}/UsersAPI","DynamoDBWriteError",{"color":"#8c564b"}],
                  ["${AWS::StackName}/UsersAPI","AuthorizationFailure",{"color":"#ff7f0e"}],
                  ["${AWS::StackName}/UsersAPI","ValidationError",{"color":"#bcbd22"}]
                ],
                "period": 300, "stat": "Sum", "view": "timeSeries"
              }
            }
          ]
        }

Outputs:
  UsersTable:
    Description: DynamoDB Users table
    Value: !Ref UsersTable

  UsersApi:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${UsersApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  UsersFunction:
    Description: Lambda Function ARN
    Value: !GetAtt UsersFunction.Arn

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  Dashboard:
    Description: CloudWatch Dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home#dashboards:name=${AWS::StackName}-Dashboard"
